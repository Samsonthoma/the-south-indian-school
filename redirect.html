<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>The South Indian School - WhatsApp Channel</title>
  <style>
    /*------------------------
      Global & Reset
    ------------------------*/
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f4c75 100%);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Helvetica Neue', sans-serif;
      overflow: hidden;
      color: #ffffff;
    }

    /*------------------------
      Animated Background Particles
    ------------------------*/
    .particles {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    .particle {
      position: absolute;
      width: 4px;
      height: 4px;
      background: rgba(74, 222, 128, 0.5);
      border-radius: 50%;
      animation: float-particle 15s infinite ease-in-out;
    }

    @keyframes float-particle {
      0% {
        transform: translateY(0) translateX(0);
        opacity: 0;
      }
      10% {
        opacity: 1;
      }
      90% {
        opacity: 1;
      }
      100% {
        transform: translateY(-100vh) translateX(100px);
        opacity: 0;
      }
    }

    /*------------------------
      Container
    ------------------------*/
    .container {
      max-width: 500px;
      width: 100%;
      padding: 2rem;
      text-align: center;
      position: relative;
      z-index: 10;
    }

    /*------------------------
      Animated Logo / Loading Animation
    ------------------------*/
    .logo-container {
      position: relative;
      width: 200px;
      height: 200px;
      margin: 0 auto 3rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Orbiting elements */
    .orbit {
      position: absolute;
      border-radius: 50%;
      animation: rotate-orbit 6s linear infinite;
    }

    .orbit-1 {
      width: 180px;
      height: 180px;
      border: 2px solid rgba(74, 222, 128, 0.3);
    }

    .orbit-2 {
      width: 120px;
      height: 120px;
      border: 2px dashed rgba(59, 130, 246, 0.3);
      animation-duration: 8s;
      animation-direction: reverse;
    }

    .orbit-3 {
      width: 80px;
      height: 80px;
      border: 1px solid rgba(168, 85, 247, 0.3);
      animation-duration: 10s;
    }

    @keyframes rotate-orbit {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    /* Orbiting satellites */
    .satellite {
      position: absolute;
      width: 12px;
      height: 12px;
      background: #4ade80;
      border-radius: 50%;
      box-shadow: 0 0 12px #4ade80;
      top: -6px;
      left: 50%;
      transform: translateX(-50%);
    }

    .orbit-1 .satellite { animation: pulse-float 1s ease-in-out infinite; }
    .orbit-2 .satellite { background: #3b82f6; box-shadow: 0 0 12px #3b82f6; }
    .orbit-3 .satellite { background: #a855f7; box-shadow: 0 0 12px #a855f7; }

    @keyframes pulse-float {
      0%, 100% { transform: translateX(-50%) translateY(0); }
      50% { transform: translateX(-50%) translateY(-3px); }
    }

    /* Center glowing circle */
    .center-glow {
      position: absolute;
      width: 120px;
      height: 120px;
      background: radial-gradient(circle at 30% 30%, rgba(74, 222, 128, 0.3), rgba(59, 130, 246, 0.1));
      border-radius: 50%;
      border: 2px solid rgba(74, 222, 128, 0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
      animation: glow-pulse 2s ease-in-out infinite;
      box-shadow: 
        0 0 30px rgba(74, 222, 128, 0.4),
        0 0 60px rgba(59, 130, 246, 0.2),
        inset 0 0 30px rgba(74, 222, 128, 0.1);
    }

    @keyframes glow-pulse {
      0%, 100% {
        transform: scale(1);
        box-shadow: 
          0 0 30px rgba(74, 222, 128, 0.4),
          0 0 60px rgba(59, 130, 246, 0.2),
          inset 0 0 30px rgba(74, 222, 128, 0.1);
      }
      50% {
        transform: scale(1.05);
        box-shadow: 
          0 0 50px rgba(74, 222, 128, 0.6),
          0 0 80px rgba(59, 130, 246, 0.3),
          inset 0 0 40px rgba(74, 222, 128, 0.15);
      }
    }

    .center-icon {
      font-size: 4rem;
      animation: icon-rotate 4s linear infinite;
    }

    @keyframes icon-rotate {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    /* Floating message bubbles */
    .bubble {
      position: absolute;
      font-size: 1.5rem;
      animation: bubble-float 4s ease-in-out infinite;
      filter: drop-shadow(0 0 8px rgba(74, 222, 128, 0.4));
    }

    .bubble-1 { top: -20px; left: 20%; animation-delay: 0s; }
    .bubble-2 { top: -15px; right: 15%; animation-delay: 0.8s; }
    .bubble-3 { bottom: -10px; left: 30%; animation-delay: 1.6s; }

    @keyframes bubble-float {
      0% {
        transform: translateY(0) scale(1);
        opacity: 0;
      }
      10% {
        opacity: 1;
      }
      90% {
        opacity: 1;
      }
      100% {
        transform: translateY(-80px) scale(0.8);
        opacity: 0;
      }
    }

    /*------------------------
      Content Section
    ------------------------*/
    .content {
      margin-bottom: 2rem;
      animation: slide-up 0.8s ease-out;
    }

    @keyframes slide-up {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .title {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 0.5rem;
      background: linear-gradient(135deg, #4ade80, #3b82f6, #a855f7);
      background-size: 200% 200%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: gradient-shift 4s ease infinite;
    }

    @keyframes gradient-shift {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }

    .subtitle {
      font-size: 1rem;
      color: rgba(255, 255, 255, 0.7);
      margin-bottom: 1.5rem;
      line-height: 1.6;
    }

    /*------------------------
      Status Section
    ------------------------*/
    .status {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      margin: 2rem 0;
      padding: 1rem;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      backdrop-filter: blur(10px);
      animation: slide-up 0.8s ease-out 0.1s both;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      background: #4ade80;
      border-radius: 50%;
      animation: pulse-status 1.5s ease-in-out infinite;
      box-shadow: 0 0 8px #4ade80;
    }

    @keyframes pulse-status {
      0%, 100% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.2);
      }
    }

    .status-text {
      font-size: 0.95rem;
      color: rgba(255, 255, 255, 0.85);
    }

    /*------------------------
      Progress Bar
    ------------------------*/
    .progress-section {
      margin: 2rem 0;
      animation: slide-up 0.8s ease-out 0.2s both;
    }

    .progress-label {
      font-size: 0.8rem;
      color: rgba(255, 255, 255, 0.6);
      margin-bottom: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .progress-bar {
      width: 100%;
      height: 4px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 2px;
      overflow: hidden;
      position: relative;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #4ade80, #3b82f6, #a855f7, #4ade80);
      background-size: 200% 100%;
      animation: progress-flow 2s ease-in-out infinite;
    }

    .progress-shimmer {
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
      animation: shimmer 1.5s infinite;
    }

    @keyframes progress-flow {
      0%, 100% { background-position: 0% 0%; }
      50% { background-position: 100% 0%; }
    }

    @keyframes shimmer {
      0% { left: -100%; }
      100% { left: 100%; }
    }

    /*------------------------
      Footer Text
    ------------------------*/
    .footer {
      font-size: 0.85rem;
      color: rgba(255, 255, 255, 0.5);
      margin-top: 2rem;
      animation: slide-up 0.8s ease-out 0.3s both;
    }

    .footer a {
      color: #4ade80;
      text-decoration: none;
      transition: all 0.3s ease;
      position: relative;
    }

    .footer a::after {
      content: '';
      position: absolute;
      bottom: -2px;
      left: 0;
      width: 0;
      height: 1px;
      background: #4ade80;
      transition: width 0.3s ease;
    }

    .footer a:hover::after {
      width: 100%;
    }

    /*------------------------
      Responsive
    ------------------------*/
    @media (max-width: 600px) {
      .container {
        padding: 1.5rem;
      }

      .title {
        font-size: 1.5rem;
      }

      .subtitle {
        font-size: 0.9rem;
      }

      .logo-container {
        width: 140px;
        height: 140px;
        margin: 0 auto 2rem;
      }

      .orbit-1 {
        width: 130px;
        height: 130px;
      }

      .orbit-2 {
        width: 85px;
        height: 85px;
      }

      .orbit-3 {
        width: 55px;
        height: 55px;
      }

      .center-glow {
        width: 85px;
        height: 85px;
      }

      .center-icon {
        font-size: 2.5rem;
      }
    }
  </style>
</head>
<body>
  <div class="particles" id="particlesContainer"></div>

  <div class="container">
    <div class="logo-container">
      <!-- Orbiting rings -->
      <div class="orbit orbit-1">
        <div class="satellite"></div>
      </div>
      <div class="orbit orbit-2">
        <div class="satellite"></div>
      </div>
      <div class="orbit orbit-3">
        <div class="satellite"></div>
      </div>

      <!-- Floating bubbles -->
      <div class="bubble bubble-1">✓</div>
      <div class="bubble bubble-2"></div>
      <div class="bubble bubble-3">→</div>

      <!-- Center glowing circle -->
      <div class="center-glow">
        <div class="center-icon">💬</div>
      </div>
    </div>

    <div class="content">
      <h1 class="title">Redirecting to WhatsApp</h1>
      <p class="subtitle">Connecting you to The South Indian School's official WhatsApp channel</p>
    </div>

    <div class="status">
      <div class="status-dot"></div>
      <span class="status-text">Opening secure channel...</span>
    </div>

    <div class="progress-section">
      <div class="progress-label">Loading</div>
      <div class="progress-bar">
        <div class="progress-fill"></div>
        <div class="progress-shimmer"></div>
      </div>
    </div>

    <div class="footer">
      <p>Please wait. If you are not redirected automatically, <a href="https://whatsapp.com/channel/0029Va9Tne5KwqSMcl5ZnE2B/300">click here</a>.</p>
    </div>
  </div>

  <script>
    // Create animated particles
    function createParticles() {
      const container = document.getElementById('particlesContainer');
      const particleCount = 30;
      
      for (let i = 0; i < particleCount; i++) {
        const particle = document.createElement('div');
        particle.className = 'particle';
        
        const x = Math.random() * 100;
        const y = Math.random() * 100;
        const duration = 10 + Math.random() * 10;
        const delay = Math.random() * 5;
        
        particle.style.left = x + '%';
        particle.style.top = y + '%';
        particle.style.animation = `float-particle ${duration}s infinite ease-in-out ${delay}s`;
        
        container.appendChild(particle);
      }
    }

    // Initialize particles on load
    window.addEventListener('DOMContentLoaded', () => {
      createParticles();

      // Redirect after 6 seconds
      setTimeout(() => {
        const channelUrl = 'https://whatsapp.com/channel/0029Va9Tne5KwqSMcl5ZnE2B/300';
        const ua = navigator.userAgent.toLowerCase();
        const isAndroid = ua.includes('android');
        if (isAndroid) {
          window.location.href = 
            'intent://' +
            channelUrl.replace(/^https?:\/\//, '') +
            '#Intent;scheme=https;package=com.whatsapp;action=android.intent.action.VIEW;end';
        } else {
          window.location.href = channelUrl;
        }
      }, 6000);
    });
  </script>
</body>
</html>
